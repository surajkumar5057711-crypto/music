<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07070d">
<title>Mera Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07070d; --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.09); --text:#f6f6fb; --muted:#9b9bb4;
          --a1:#2cff9a; --a2:#7c5cff; --a3:#ff4d8d; --a4:#ffb347; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--text); font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow-x:hidden; }

  /* aurora background */
  .aurora { position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .aurora i { position:absolute; width:340px; height:340px; border-radius:50%; filter:blur(80px); opacity:.45; animation:drift 18s ease-in-out infinite alternate; }
  .aurora i:nth-child(1){ background:var(--a2); left:-90px; top:-60px; }
  .aurora i:nth-child(2){ background:var(--a3); right:-120px; top:25%; animation-duration:22s; opacity:.30; }
  .aurora i:nth-child(3){ background:var(--a1); left:15%; bottom:-140px; animation-duration:26s; opacity:.22; }
  @keyframes drift { to { transform:translate(60px,80px) scale(1.2); } }

  header { position:sticky; top:0; z-index:8; padding:12px 14px; background:rgba(7,7,13,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo { width:36px; height:36px; border-radius:12px; display:flex; align-items:flex-end; justify-content:center; gap:3px; padding:9px 8px;
          background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3)); box-shadow:0 6px 20px #7c5cff66; }
  .logo i { width:4px; background:#07070d; border-radius:2px; animation:eq 1s ease-in-out infinite; }
  .logo i:nth-child(1){ height:40%; } .logo i:nth-child(2){ height:90%; animation-delay:.25s } .logo i:nth-child(3){ height:60%; animation-delay:.5s }
  @keyframes eq { 0%,100%{ transform:scaleY(.45) } 50%{ transform:scaleY(1) } }
  .logo i { transform-origin:bottom; }
  h1 { font-size:22px; font-weight:800; letter-spacing:.2px; background:linear-gradient(90deg,#fff,#c9b8ff 50%,var(--a1)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  form { display:flex; gap:8px; margin-top:10px; }
  .sw { flex:1; position:relative; min-width:0; }
  .sw span { position:absolute; left:15px; top:50%; transform:translateY(-50%); opacity:.6; font-size:15px; }
  input[type=text] { width:100%; background:var(--glass); border:1px solid var(--line); color:var(--text); padding:13px 16px 13px 42px; border-radius:16px; font:inherit; font-size:15px; outline:none; transition:.2s; }
  input[type=text]:focus { border-color:var(--a2); box-shadow:0 0 0 3px #7c5cff30, 0 0 24px #7c5cff30; }
  form button { background:linear-gradient(135deg,var(--a1),#14c97c); color:#04150c; border:0; font:inherit; font-weight:800; padding:0 20px; border-radius:16px; cursor:pointer; box-shadow:0 6px 18px #2cff9a40; }

  main { padding:16px 14px; max-width:980px; margin:0 auto; }

  /* hero */
  .hero { width:100%; border:0; text-align:left; color:#fff; cursor:pointer; position:relative; overflow:hidden; border-radius:26px; padding:22px 20px 20px; min-height:178px; font:inherit;
          background:linear-gradient(120deg,#6a3df0,#c13cd9,#ff5c8a,#ff9a5c); background-size:240% 240%; animation:flow 9s ease infinite; box-shadow:0 18px 50px #7c3df059; }
  @keyframes flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .hero::after { content:""; position:absolute; inset:0; background:radial-gradient(260px 160px at 85% 10%, #ffffff30, transparent); pointer-events:none; }
  .hero small { display:block; font-size:12px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; opacity:.85; }
  .hero b { display:block; font-size:26px; font-weight:800; line-height:1.1; margin:6px 0 14px; max-width:68%; }
  .orb { position:absolute; right:14px; top:12px; font-size:66px; filter:drop-shadow(0 8px 18px #0006); animation:float 4s ease-in-out infinite; }
  @keyframes float { 50%{ transform:translateY(-8px) rotate(5deg) } }
  .wave { display:flex; align-items:center; gap:3px; height:26px; margin-bottom:14px; }
  .wave i { width:3px; border-radius:2px; background:#ffffffcc; animation:wv 1.1s ease-in-out infinite; }
  @keyframes wv { 0%,100%{ height:4px } 50%{ height:24px } }
  .cta { display:inline-flex; gap:8px; align-items:center; background:#08080fcc; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:700; backdrop-filter:blur(6px); }

  h2 { font-size:16px; font-weight:700; margin:26px 2px 12px; display:flex; align-items:center; gap:8px; }
  h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

  .row { display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .row::-webkit-scrollbar { display:none; }

  .mood { flex:none; width:104px; height:112px; border:0; border-radius:22px; color:#fff; cursor:pointer; position:relative; overflow:hidden; font:inherit; text-align:left; padding:12px; scroll-snap-align:start;
          box-shadow:0 10px 24px #0006; transition:transform .18s; }
  .mood:active { transform:scale(.94); }
  .mood .e { font-size:34px; display:block; filter:drop-shadow(0 4px 8px #0005); }
  .mood .n { position:absolute; left:12px; bottom:11px; font-weight:700; font-size:14px; }
  .mood::after { content:""; position:absolute; right:-24px; top:-24px; width:80px; height:80px; border-radius:50%; background:#ffffff26; }

  .lang { flex:none; display:flex; align-items:center; gap:9px; padding:7px 15px 7px 7px; border-radius:999px; background:var(--glass); border:1px solid var(--line); color:var(--text); font:inherit; font-size:14px; font-weight:500; cursor:pointer; transition:.15s; }
  .lang:active { transform:scale(.95); }
  .lang u { text-decoration:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:700; color:#fff; }

  #status { color:var(--muted); font-size:13px; margin:22px 2px 6px; min-height:18px; }

  .feat { position:relative; border-radius:24px; overflow:hidden; cursor:pointer; margin-top:6px; box-shadow:0 14px 40px #0008; animation:up .5s both; }
  .feat img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#15151f; }
  .feat::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 35%,#07070dee); }
  .feat .txt { position:absolute; left:16px; right:70px; bottom:14px; z-index:2; }
  .feat .tag { font-size:11px; font-weight:700; letter-spacing:1.4px; color:var(--a1); text-transform:uppercase; }
  .feat .t { font-size:19px; font-weight:700; line-height:1.2; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .feat .a { font-size:13px; color:#c4c4d8; margin-top:3px; }
  .pbtn { position:absolute; right:14px; bottom:14px; z-index:2; width:50px; height:50px; border-radius:50%; display:grid; place-items:center; background:var(--a1); color:#04150c; font-size:19px; box-shadow:0 8px 24px #2cff9a66; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:14px; margin-top:14px; }
  .tile { position:relative; cursor:pointer; border-radius:18px; overflow:hidden; background:var(--glass); border:1px solid var(--line); transition:transform .15s, border-color .2s; animation:up .5s both; }
  .tile:active { transform:scale(.96); }
  .tile .im { position:relative; }
  .tile img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#15151f; }
  .tile .pl { position:absolute; right:8px; bottom:8px; width:30px; height:30px; border-radius:50%; background:#000a; backdrop-filter:blur(4px); display:grid; place-items:center; font-size:12px; }
  .tile .info { padding:10px 11px 12px; }
  .tile .t { font-size:13px; font-weight:500; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:34px; }
  .tile .a { font-size:11.5px; color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.now, .feat.now { box-shadow:0 0 0 2px var(--a1), 0 0 28px #2cff9a55; }
  .tile.now .pl, .feat.now .pbtn { background:var(--a1); color:#04150c; }
  @keyframes up { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }

  .sk { border-radius:18px; height:150px; background:linear-gradient(100deg,#14141f 30%,#20202f 50%,#14141f 70%); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  .sk.big { height:210px; border-radius:24px; margin-top:6px; }
  @keyframes sh { to { background-position:-200% 0 } }

  /* dock */
  #dock { position:fixed; left:0; right:0; bottom:0; z-index:12; display:none; background:rgba(14,14,24,.86); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
          border-top:1px solid var(--line); border-radius:22px 22px 0 0; box-shadow:0 -12px 40px #000a; }
  #dock.on { display:block; }
  #prog { height:4px; background:#ffffff18; cursor:pointer; border-radius:22px 22px 0 0; overflow:hidden; }
  #prog b { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3)); }
  #video { width:100%; aspect-ratio:16/9; background:#000; }
  #dock.big #video { max-width:560px; margin:10px auto 0; border-radius:14px; overflow:hidden; }
  #bar { display:flex; align-items:center; gap:10px; padding:10px 12px; min-height:70px; }
  #bar .meta { flex:1; min-width:0; }
  #now { font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nowA { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .ctl { display:flex; align-items:center; gap:2px; }
  .ctl button { background:none; border:0; color:var(--text); font-size:19px; width:38px; height:38px; cursor:pointer; border-radius:50%; }
  .ctl button.active { background:#2cff9a30; }
  .ctl .play { background:linear-gradient(135deg,var(--a1),#14c97c); color:#04150c; font-size:17px; box-shadow:0 6px 16px #2cff9a55; }
  #dock.mini #video { position:absolute; left:12px; top:16px; width:108px; border-radius:10px; overflow:hidden; }
  #dock.mini #bar { padding-left:134px; }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<header>
  <div class="brand"><div class="logo"><i></i><i></i><i></i></div><h1>Mera Music</h1></div>
  <form id="f">
    <div class="sw"><span>🔎</span><input type="text" id="q" placeholder="Gaana ya artist ka naam..." autocomplete="off"></div>
    <button>Search</button>
  </form>
</header>

<main>
  <button class="hero" id="daily">
    <div class="orb" id="dailyEm">🌅</div>
    <small id="greet">Aaj ki playlist</small>
    <b id="dailyT"></b>
    <div class="wave" id="wave"></div>
    <span class="cta">▶ Abhi chalao</span>
  </button>

  <h2>✨ Mood chuno</h2>
  <div class="row" id="moods"></div>

  <h2>🌍 Apni bhasha</h2>
  <div class="row" id="langs"></div>

  <div id="status"></div>
  <div id="feat"></div>
  <div class="grid" id="list"></div>
</main>

<div id="dock" class="big">
  <div id="prog"><b id="progB"></b></div>
  <div id="video"><div id="yt"></div></div>
  <div id="bar">
    <div class="meta"><div id="now">Kuch chalao bhai</div><div id="nowA"></div></div>
    <div class="ctl">
      <button id="prev">⏮</button>
      <button id="pp" class="play">⏸</button>
      <button id="next">⏭</button>
      <button id="wl" title="Screen on rakho">🔓</button>
      <button id="size" title="Chhota / bada">⌄</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'AIzaSyChU_iJtPOv6J00re4kEvp1wsFTJuctjl4';

let queue = [], idx = -1, ytPlayer = null, ytReady = false, pendingYT = null;

const MOODS = [
  ['🔥','Trending','trending new songs this week','#ff512f,#dd2476'],
  ['🆕','Naye Gaane','new songs 2026','#7f00ff,#e100ff'],
  ['🎬','Bollywood','latest bollywood songs','#f7971e,#ff5e62'],
  ['😄','Happy','happy upbeat hindi songs','#f6d365,#fda085'],
  ['😌','Chill','chill relaxing hindi songs','#43cea2,#185a9d'],
  ['💕','Romantic','romantic hindi songs','#ff6a88,#c3317b'],
  ['💔','Sad','sad hindi songs','#4b6cb7,#182848'],
  ['🎉','Party','party dance songs','#ee0979,#ff6a00'],
  ['💪','Workout','workout gym motivation songs','#11998e,#38ef7d'],
  ['🧘','Lo-fi','lofi hindi songs','#654ea3,#eaafc8'],
];
const LANGS = [
  ['हि','Hindi','hindi'],['भो','Bhojpuri','bhojpuri'],['म','Marathi','marathi'],['తె','Telugu','telugu'],
  ['বা','Bengali','bengali'],['த','Tamil','tamil'],['ਪੰ','Punjabi','punjabi'],['മ','Malayalam','malayalam'],
  ['ಕ','Kannada','kannada'],['ગુ','Gujarati','gujarati'],['En','English','english'],['K','K-pop','kpop'],['Es','Spanish','spanish']
];

function dailyInfo(){
  const h = new Date().getHours();
  if (h < 5)  return { em:'🌌', g:'Shubh Raatri',  t:'Raat ki neend wali playlist', q:'night calm songs hindi' };
  if (h < 12) return { em:'🌅', g:'Shubh Prabhat', t:'Subah ki fresh energy',      q:'morning fresh energy songs hindi' };
  if (h < 17) return { em:'☀️', g:'Shubh Dopahar', t:'Dopahar ka focus mode',      q:'focus lofi study songs' };
  if (h < 21) return { em:'🌇', g:'Shubh Sandhya', t:'Shaam ke hit gaane',         q:'evening latest hit songs hindi' };
  return { em:'🌙', g:'Shubh Raatri', t:'Raat ka chill', q:'late night chill hindi songs' };
}

function decode(s){ return new DOMParser().parseFromString(s,'text/html').documentElement.textContent; }
function status(m){ $('#status').textContent = m; }

async function searchYT(q){
  const u = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=24&q='
    + encodeURIComponent(q) + '&key=' + encodeURIComponent(KEY);
  const r = await fetch(u); const d = await r.json();
  if (d.error) {
    const m = (d.error.message || '').toLowerCase();
    if (m.includes('quota')) throw new Error('Aaj ki search limit khatam ho gayi. Kal phir try karna.');
    throw new Error('Search nahi ho paayi. Thodi der baad try karo.');
  }
  return (d.items||[]).map(i => ({
    id:i.id.videoId, title:decode(i.snippet.title), artist:decode(i.snippet.channelTitle),
    thumb:(i.snippet.thumbnails.medium||i.snippet.thumbnails.default).url
  }));
}

function skeleton(){
  $('#feat').innerHTML = '<div class="sk big"></div>';
  $('#list').innerHTML = '<div class="sk"></div>'.repeat(6);
}

async function run(q, label){
  status(label ? label : 'Dhoondh raha hoon...');
  skeleton();
  window.scrollTo({ top: $('#status').offsetTop - 90, behavior:'smooth' });
  try {
    const items = await searchYT(q);
    queue = items; idx = -1;
    if (!items.length) { $('#feat').innerHTML=''; $('#list').innerHTML=''; status('Kuch nahi mila. Doosra naam try karo.'); return; }
    status((label ? label + ' • ' : '') + items.length + ' gaane');
    render();
  } catch(e){ $('#feat').innerHTML=''; $('#list').innerHTML=''; status(e.message); }
}

function mk(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function render(){
  const feat = $('#feat'), list = $('#list'); feat.innerHTML = ''; list.innerHTML = '';
  queue.forEach((t,i) => {
    if (i === 0) {
      const f = mk('div','feat'); f.dataset.i = 0;
      const img = mk('img'); img.src = t.thumb; img.alt = '';
      const txt = mk('div','txt');
      txt.append(mk('div','tag','Top pick'), mk('div','t',t.title), mk('div','a',t.artist));
      f.append(img, txt, mk('div','pbtn','▶'));
      f.onclick = () => play(0);
      feat.append(f);
      return;
    }
    const el = mk('div','tile'); el.dataset.i = i; el.style.animationDelay = (Math.min(i,12) * 40) + 'ms';
    const im = mk('div','im'); const img = mk('img'); img.src = t.thumb; img.loading = 'lazy'; img.alt = '';
    im.append(img, mk('div','pl','▶'));
    const info = mk('div','info');
    info.append(mk('div','t',t.title), mk('div','a',t.artist));
    el.append(im, info);
    el.onclick = () => play(i);
    list.append(el);
  });
}

function play(i){
  if (i < 0 || i >= queue.length) return;
  idx = i; const t = queue[i];
  $('#dock').classList.add('on');
  $('#now').textContent = t.title; $('#nowA').textContent = t.artist;
  document.querySelectorAll('.tile,.feat').forEach(r => r.classList.toggle('now', +r.dataset.i === i));
  if (ytReady) ytPlayer.loadVideoById(t.id); else pendingYT = t.id;
  setMedia(t); setPP(true);
}

function setMedia(t){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title:t.title, artist:t.artist, artwork:[{ src:t.thumb, sizes:'320x180' }]
    });
    navigator.mediaSession.setActionHandler('play', () => $('#pp').click());
    navigator.mediaSession.setActionHandler('pause', () => $('#pp').click());
    navigator.mediaSession.setActionHandler('nexttrack', next);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  } catch(e){}
}

function setPP(playing){ $('#pp').textContent = playing ? '⏸' : '▶'; }
function next(){ if (queue.length) play((idx+1) % queue.length); }
function prev(){ if (queue.length) play((idx-1+queue.length) % queue.length); }

$('#next').onclick = next; $('#prev').onclick = prev;
$('#pp').onclick = () => {
  if (idx < 0) { if (queue.length) play(0); return; }
  if (ytReady) { ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); }
};
$('#size').onclick = () => {
  const d = $('#dock'), big = d.classList.contains('big');
  d.classList.toggle('big', !big); d.classList.toggle('mini', big);
  $('#size').textContent = big ? '⌃' : '⌄';
};
$('#prog').onclick = e => {
  if (!ytReady || idx < 0) return;
  const r = e.currentTarget.getBoundingClientRect();
  const dur = ytPlayer.getDuration() || 0;
  ytPlayer.seekTo(dur * ((e.clientX - r.left) / r.width), true);
};
setInterval(() => {
  if (!ytReady || idx < 0) return;
  try {
    const dur = ytPlayer.getDuration() || 0, cur = ytPlayer.getCurrentTime() || 0;
    $('#progB').style.width = dur ? (cur / dur * 100) + '%' : '0';
  } catch(e){}
}, 500);
new ResizeObserver(() => {
  const d = $('#dock');
  document.body.style.paddingBottom = d.classList.contains('on') ? (d.offsetHeight + 20) + 'px' : '24px';
}).observe($('#dock'));

// Screen on rakho (wake lock)
let wl = null, wlOn = false;
async function wlAcquire(){ try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch(e){} }
$('#wl').onclick = async () => {
  if (!('wakeLock' in navigator)) { status('Is browser me screen-on option nahi hai.'); return; }
  wlOn = !wlOn;
  if (wlOn) await wlAcquire(); else { try { if (wl) await wl.release(); } catch(e){} wl = null; }
  $('#wl').textContent = wlOn ? '🔒' : '🔓';
  $('#wl').classList.toggle('active', wlOn);
};
document.addEventListener('visibilitychange', () => { if (wlOn && document.visibilityState === 'visible') wlAcquire(); });

// YouTube IFrame API
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.append(s);
window.onYouTubeIframeAPIReady = () => {
  ytPlayer = new YT.Player('yt', {
    width:'100%', height:'100%', playerVars:{ playsinline:1, rel:0 },
    events:{
      onReady: () => { ytReady = true; if (pendingYT) { ytPlayer.loadVideoById(pendingYT); pendingYT = null; } },
      onStateChange: e => { if (e.data === 0) next(); if (e.data === 1) setPP(true); if (e.data === 2) setPP(false); },
      onError: () => next()
    }
  });
};

// UI wiring
$('#f').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) { run(q + ' song'); $('#q').blur(); } };

MOODS.forEach(([em,n,q,g]) => {
  const b = mk('button','mood'); const [c1,c2] = g.split(',');
  b.style.background = `linear-gradient(135deg,${c1},${c2})`;
  b.append(mk('span','e',em), mk('span','n',n));
  b.onclick = () => run(q, em + ' ' + n);
  $('#moods').append(b);
});
LANGS.forEach(([sc,n,k],i) => {
  const b = mk('button','lang'); const h = (i*53 + 260) % 360;
  const u = mk('u',null,sc); u.style.background = `linear-gradient(135deg,hsl(${h} 70% 50%),hsl(${(h+50)%360} 70% 40%))`;
  b.append(u, document.createTextNode(n));
  b.onclick = () => run('latest ' + k + ' songs', n);
  $('#langs').append(b);
});

const d0 = dailyInfo();
$('#dailyEm').textContent = d0.em; $('#greet').textContent = d0.g; $('#dailyT').textContent = d0.t;
